#
# OSSF Scorecard — weekly supply-chain hygiene scoring. Results are
# published to the public Scorecard API, which is what drives the README
# badge and https://scorecard.dev/viewer/?uri=github.com/camadkins/promptcite
#
# Results are deliberately NOT uploaded to GitHub code scanning. Scorecard
# emits its findings at `error` severity, so posture notes like "repository was
# created within the last 90 days" or "project is not fuzzed" sit in the same
# alert list as real defects and turn the aggregate code-scanning check red on
# every PR. That cost us: three genuine CodeQL race-condition findings in
# bin/hook.js were merged past because the check had been red for unrelated
# reasons for weeks. Code scanning is for defects; posture scoring lives on
# scorecard.dev.
# See https://github.com/ossf/scorecard

name: OSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '32 7 * * 1'   # Mondays at 07:32 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # No security-events: write — nothing is written to code scanning now,
      # so the job runs with strictly less authority than it used to.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
