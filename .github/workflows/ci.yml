# CI — typecheck + install dry-run across Linux and macOS runners.
# Runs on every PR + every push to main.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install devDeps
        # Dropped --frozen-lockfile because Dependabot updates package.json
        # without updating bun.lock (Dependabot's npm ecosystem doesn't
        # know about bun's lockfile format). With --frozen-lockfile, every
        # Dependabot npm-deps PR would be permanently blocked.
        # Trade-off: CI may resolve fresh versions if a non-frozen
        # range allows it. Deterministic-build matters less here because
        # bin/install.js has zero runtime deps; only devDeps are at stake.
        run: bun install

      - name: Typecheck
        run: bun run typecheck

  test:
    # package.json says node >=18, so test every major we claim.
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Run unit tests
        run: node --test tests/*.test.js

      # Coverage floor, a little under where we are now (lines 94, branches
      # 73, funcs 89). The threshold flags need node 22.8+, so 24 only.
      - name: Coverage floor
        if: matrix.node == '24'
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-lines=90 --test-coverage-branches=70
          --test-coverage-functions=85 tests/*.test.js

  install-dry-run:
    name: Install dry-run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # git bash on windows, so the sandbox check below runs the same everywhere
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '18'

      - name: install.js --list
        run: node bin/install.js --list

      - name: install.js --help
        run: node bin/install.js --help

      - name: install.js --version
        run: node bin/install.js --version

      - name: install.js --dry-run --all (no files should be written)
        run: |
          # Route dry-run at an explicit sandbox config-dir. If --dry-run
          # writes anything, the sandbox path will exist after the run.
          # Asserting that path absence after = strict guarantee that
          # dry-run produced zero file writes regardless of runner state.
          SANDBOX="/tmp/promptcite-dry-run-sandbox-$$"
          rm -rf "$SANDBOX"
          node bin/install.js --dry-run --all --config-dir "$SANDBOX"
          if [ -e "$SANDBOX" ]; then
            echo "ERROR: --dry-run created the sandbox path despite --dry-run flag"
            ls -la "$SANDBOX"
            exit 1
          fi
          echo "OK: --dry-run wrote nothing (sandbox path absent)"

      - name: Schema YAML validity
        run: |
          node -e "
            const fs = require('fs');
            const content = fs.readFileSync('src/schema.yaml', 'utf8');
            if (content.length < 100) { console.error('schema.yaml suspiciously small'); process.exit(1); }
            console.log('schema.yaml present and non-trivial (' + content.length + ' bytes)');
          "

  gemini-extension-valid:
    name: Gemini extension manifest valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate gemini-extension.json
        run: |
          node -e "
            const p = JSON.parse(require('fs').readFileSync('gemini-extension.json', 'utf8'));
            if (!p.name || !p.description || !p.version || !p.contextFileName) {
              console.error('gemini-extension.json missing required field');
              process.exit(1);
            }
            console.log('gemini-extension.json valid:', p);
          "

  gemini-sync:
    name: Locales valid and GEMINI.md in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify locales and sync
        # GEMINI.md is receipt.md with every src/locales/ file composed in.
        # Fix a failure with: node bin/rule.js --write-gemini
        run: node bin/rule.js --check
