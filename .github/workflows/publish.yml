#
# npm publish. Deliberately triggered by a GitHub Release being PUBLISHED,
# not by a tag push.
#
# release.yml creates the GitHub Release as a DRAFT for the maintainer to
# review. Publishing to npm is irreversible in practice -- `npm unpublish` is
# only permitted within 72 hours and a version number can never be reused -- so
# it must not happen before a human has looked at the release. Clicking
# "publish" on the draft is that decision, and this workflow hangs off it. One
# gate, one deliberate act.
#
# ONE-TIME SETUP (not automated, and not automatable):
#   1. Create an npm automation token on npmjs.com (Access Tokens -> Generate ->
#      Automation).
#   2. Add it to this repo as the secret NPM_TOKEN.
#   3. After the first successful publish, consider migrating to npm trusted
#      publishing (OIDC) so no long-lived token is stored at all. Trusted
#      publishing needs the package to already exist, which is why the first
#      release uses a token.

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Never publish a prerelease to the default dist-tag by accident.
    if: github.event.release.prerelease == false
    permissions:
      contents: read
      id-token: write # provenance attestation
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # The tag is what a user will `npm install`, so it has to be the version
      # in package.json. release-please keeps them in step; a mismatch means
      # something was tagged by hand, and publishing the wrong version is not
      # recoverable.
      - name: Tag must match package.json version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR: release tag $TAG does not match package.json $PKG"
            exit 1
          fi
          echo "OK: $TAG matches package.json"

      # Publishing a package that fails its own tests would be worse than not
      # publishing. Zero runtime deps means there is nothing to install first.
      - name: Unit tests
        run: node --test tests/*.test.js

      - name: Installer smoke test
        run: |
          node bin/install.js --version
          node bin/install.js --list
          node bin/verify.js examples/brainstorm-receipt.json
          node bin/verify.js examples/multi-session-receipt.json

      # Prove the tarball is complete before it is published rather than after.
      # `files` in package.json is an allowlist, so dropping something the CLI
      # reads at runtime -- src/rules/receipt.md, say -- breaks every install
      # while every in-repo test still passes.
      - name: Packaged tarball actually works
        run: |
          npm pack
          WORK="$(mktemp -d)"
          cp promptcite-*.tgz "$WORK/"
          cd "$WORK"
          npm init -y >/dev/null 2>&1
          npm install ./promptcite-*.tgz >/dev/null 2>&1
          ./node_modules/.bin/promptcite --version
          ./node_modules/.bin/promptcite --list >/dev/null
          # Exercises readRuleSource(), which reads src/rules/receipt.md out of
          # the installed package.
          ./node_modules/.bin/promptcite --print-rule | head -1
          test "$(./node_modules/.bin/promptcite --print-rule | wc -l)" -gt 500 \
            || { echo "ERROR: --print-rule returned too little; src/ may be missing from the package"; exit 1; }
          echo "OK: installed package works"

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
