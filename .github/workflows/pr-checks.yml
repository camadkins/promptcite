#
# PR Checks — automated review bot. Runs a project-specific checklist
# on every PR, posts a sticky comment with fail/warn items only (or
# "looks good" when clean), and hard-fails the workflow on any breaker
# so it shows up as a required status check.

name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  checklist:
    name: PR checklist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so `git log origin/main..HEAD` and
          # `git diff origin/main..HEAD` work for the commit-message and
          # CHANGELOG/INSTALL.md-sync warning checks. Depth=0 = full clone.
          fetch-depth: 0

      - name: Run checks
        id: checks
        run: |
          set +e
          PASS=()
          WARN=()
          FAIL=()

          # Helper: record pass/warn/fail
          mark_pass() { PASS+=("$1"); }
          mark_warn() { WARN+=("$1"); }
          mark_fail() { FAIL+=("$1"); }

          # =============================================================
          # FAIL-level checks (block merge)
          # =============================================================

          # 1. SPDX header on every source file in bin/ src/ install.sh install.ps1
          MISSING_SPDX=""
          for f in bin/install.js bin/verify.js bin/hook.js bin/rule.js install.sh install.ps1 src/rules/receipt.md src/schema.yaml src/ledger.schema.yaml src/locales/*.md; do
            if [ -f "$f" ] && ! grep -q "SPDX-License-Identifier" "$f"; then
              MISSING_SPDX="$MISSING_SPDX $f"
            fi
          done
          if [ -n "$MISSING_SPDX" ]; then
            mark_fail "SPDX header missing on:$MISSING_SPDX"
          else
            mark_pass "SPDX header present on all source files"
          fi

          # 2. Locales valid and GEMINI.md composed from receipt.md + src/locales/
          if node bin/rule.js --check > /dev/null 2>&1; then
            mark_pass "Locales valid and GEMINI.md in sync"
          else
            mark_fail "Locale files invalid or GEMINI.md out of date. Run: node bin/rule.js --check"
          fi

          # 3. No network calls in shipped code (no-network rule)
          if grep -qE "fetch\(|http\.|axios|undici|node-fetch" bin/install.js bin/hook.js; then
            mark_fail "bin/ imports a network-call library or uses fetch/http — nothing shipped may make network calls"
          else
            mark_pass "No network calls in bin/install.js or bin/hook.js (no-network rule)"
          fi

          # 4. No telemetry / install_id / analytics in actual code
          TELEMETRY_HITS=$(grep -rE "telemetry|install_id|analytics|phone_home" bin/install.js bin/hook.js install.sh install.ps1 2>/dev/null | grep -vE "no telemetry|never collect|no analytics" || true)
          if [ -n "$TELEMETRY_HITS" ]; then
            mark_fail "Telemetry-related strings found outside prohibition prose"
          else
            mark_pass "No telemetry / analytics / install-id strings in code"
          fi

          # 5. schema.yaml parses (basic check)
          if [ -s src/schema.yaml ] && head -1 src/schema.yaml | grep -q "^#"; then
            mark_pass "src/schema.yaml present and well-formed"
          else
            mark_fail "src/schema.yaml malformed or missing"
          fi

          # 6. package.json license unchanged
          LICENSE=$(node -e "console.log(require('./package.json').license)" 2>/dev/null)
          if [ "$LICENSE" = "AGPL-3.0-only" ]; then
            mark_pass "package.json license is AGPL-3.0-only"
          else
            mark_fail "package.json license changed (now '$LICENSE') — must remain AGPL-3.0-only"
          fi

          # 7. package.json dependencies still empty
          DEPS=$(node -e "const d = require('./package.json').dependencies; console.log(d ? Object.keys(d).length : 0)" 2>/dev/null)
          if [ "$DEPS" = "0" ]; then
            mark_pass "package.json.dependencies is empty (zero runtime deps)"
          else
            mark_fail "package.json.dependencies has $DEPS entries — runtime deps must remain empty"
          fi

          # 8. All 7 use_category values present in receipt.md
          CATS=$(grep -oE "brainstorm|outline|draft|edit|debug|explain|search" src/rules/receipt.md | sort -u | wc -l)
          if [ "$CATS" -ge 7 ]; then
            mark_pass "All 7 use_category values present in receipt.md"
          else
            mark_fail "use_category coverage incomplete ($CATS/7 found in receipt.md)"
          fi

          # 8b. examples/*.json all parse and have required shape.
          BAD_EXAMPLES=""
          for f in examples/*.json; do
            [ -f "$f" ] || continue
            if ! node -e "
              const r = JSON.parse(require('fs').readFileSync('$f', 'utf8'));
              const cats = ['brainstorm','outline','draft','edit','debug','explain','search'];
              const sources = ['agent_reported','student_claimed'];
              // Both schema generations are valid. Branch on schema_version,
              // never on the runtime type of ai_use — an older receipt is not
              // malformed, just older. See docs/SCHEMA-CHANGELOG.md.
              const v2 = /^2\./.test(r.schema_version || '');
              const required = v2
                ? ['schema_version','generated_at','student','assignment','ai_use','outputs']
                : ['schema_version','generated_at','metadata_source','student','assignment','ai_use','outputs'];
              const missing = required.filter(k => !(k in r));
              if (missing.length) { console.error('missing keys:', missing); process.exit(1); }
              if (v2) {
                if (!Array.isArray(r.ai_use) || r.ai_use.length === 0) { console.error('ai_use must be a non-empty array in 2.0'); process.exit(1); }
                r.ai_use.forEach((u, i) => {
                  if (!cats.includes(u.category)) { console.error('invalid category in ai_use[' + i + ']'); process.exit(1); }
                  if (!sources.includes(u.metadata_source)) { console.error('invalid metadata_source in ai_use[' + i + ']'); process.exit(1); }
                  if (!u.citations || !u.citations.mla) { console.error('missing citations in ai_use[' + i + ']'); process.exit(1); }
                });
                if (!r.outputs.disclosure_statement) { console.error('missing outputs.disclosure_statement'); process.exit(1); }
              } else {
                if (!cats.includes(r.ai_use.category)) { console.error('invalid category'); process.exit(1); }
                if (!sources.includes(r.metadata_source)) { console.error('invalid metadata_source'); process.exit(1); }
              }
            " 2>/dev/null; then
              BAD_EXAMPLES="$BAD_EXAMPLES $f"
            fi
          done
          if [ -n "$BAD_EXAMPLES" ]; then
            mark_fail "example receipts do not match schema:$BAD_EXAMPLES"
          else
            mark_pass "examples/*.json all match schema"
          fi

          # 8c. bin/verify.js verifies every example receipt, so the
          # verifier and the examples can't drift apart.
          BAD_HASH=""
          for f in examples/*.json; do
            [ -f "$f" ] || continue
            node bin/verify.js "$f" >/dev/null 2>&1 || BAD_HASH="$BAD_HASH $f"
          done
          if [ -n "$BAD_HASH" ]; then
            mark_fail "bin/verify.js failed on:$BAD_HASH (hash mismatch or schema error, re-hash after editing a receipt)"
          else
            mark_pass "bin/verify.js verifies every example receipt"
          fi

          # 8d. Conventional commits required. Excludes merge commits,
          # which GitHub Actions creates synthetically for PR builds.
          # The optional `!` is the Conventional Commits breaking-change
          # marker (`feat!:`, `feat(scope)!:`) — release-please needs it to
          # cut a major, so rejecting it would block every breaking change.
          COMMITS_BAD=$(git log --no-merges origin/main..HEAD --format="%s" 2>/dev/null | grep -vE "^(feat|fix|chore|docs|refactor|test|perf|ci|build|style|revert)(\(.+\))?!?:" | wc -l || echo 0)
          if [ "$COMMITS_BAD" -gt 0 ]; then
            BAD_LIST=$(git log --no-merges origin/main..HEAD --format="%s" 2>/dev/null | grep -vE "^(feat|fix|chore|docs|refactor|test|perf|ci|build|style|revert)(\(.+\))?!?:" | head -3 | sed 's/^/    /')
            mark_fail "$COMMITS_BAD commit(s) don't use conventional prefix (feat:/fix:/chore:/docs:/refactor:/test:/perf:/ci:/build:/style:/revert:, optionally with a scope and/or a \`!\` breaking marker). First few:\n$BAD_LIST"
          else
            mark_pass "All commits use conventional prefix"
          fi

          # Lines this PR adds, for the diff-level checks below.
          ADDED=$(git diff origin/main..HEAD -- . ':(exclude).github/workflows/pr-checks.yml' | grep -E '^\+' | grep -vE '^\+\+\+ ' || true)

          # 8e. Hidden unicode. Bidi controls and zero-width characters can
          # make code read differently than it runs (Trojan Source).
          UNICODE_FILES=$(node -e "
            const { execFileSync } = require('child_process');
            const git = (...a) => execFileSync('git', a, { encoding: 'utf8', maxBuffer: 1 << 28 });
            const bad = /[\u200B-\u200F\u202A-\u202E\u2060-\u2064\u2066-\u2069\uFEFF]/;
            for (const f of git('diff', '--name-only', 'origin/main..HEAD').split('\n').filter(Boolean)) {
              const added = git('diff', 'origin/main..HEAD', '--', f).split('\n').filter(l => l.startsWith('+') && !l.startsWith('+++'));
              if (added.some(l => bad.test(l))) console.log(f);
            }
          " 2>/dev/null || true)
          if [ -n "$UNICODE_FILES" ]; then
            mark_fail "hidden unicode (bidi or zero-width characters) added in: $(echo "$UNICODE_FILES" | tr "\n" " ")"
          else
            mark_pass "No hidden unicode in added lines"
          fi

          # 8f. Every action in every workflow is pinned to a full commit SHA.
          # A tag can be moved to point at different code, a SHA can't.
          UNPINNED=$(grep -rhE '^\s*-?\s*uses:' .github/workflows | grep -vE 'uses:\s*\./' | grep -vE '@[0-9a-f]{40}(\s|$)' || true)
          if [ -n "$UNPINNED" ]; then
            mark_fail "actions not pinned to a full commit SHA: $(echo "$UNPINNED" | sed -E 's/^[[:space:]-]*uses:[[:space:]]*//' | head -5 | tr "\n" " ")"
          else
            mark_pass "All workflow actions pinned to a commit SHA"
          fi

          # 8g. No install-time scripts. Installing PromptCite must never run
          # code from package.json lifecycle hooks.
          HOOKS=$(node -e "const s = require('./package.json').scripts || {}; console.log(['preinstall','install','postinstall','preprepare','prepare','postprepare'].filter(k => k in s).join(' '))" 2>/dev/null)
          if [ -n "$HOOKS" ]; then
            mark_fail "package.json has install-time scripts: $HOOKS"
          else
            mark_pass "No install-time scripts in package.json"
          fi

          # 8h. No new executable files. The shipped executables are fixed.
          NEW_EXEC=$(git diff origin/main..HEAD --summary | grep -E '(create|new) mode 100755|mode change 100644 => 100755' | sed -E 's/.* //' || true)
          if [ -n "$NEW_EXEC" ]; then
            mark_fail "new executable file(s): $(echo "$NEW_EXEC" | tr "\n" " ")"
          else
            mark_pass "No new executable files"
          fi

          # 8i. Secrets. Common key and token formats in added lines.
          SECRET_HITS=$(echo "$ADDED" | grep -cE 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{60,}|sk-[A-Za-z0-9_-]{20,}|xox[abprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----' || true)
          if [ "${SECRET_HITS:-0}" -gt 0 ]; then
            mark_fail "$SECRET_HITS added line(s) look like a key or token. Remove it and rotate the credential"
          else
            mark_pass "No key or token patterns in added lines"
          fi

          # =============================================================
          # WARN-level checks (note for maintainer, do not block)
          # =============================================================

          # 10. Sensitive paths. On pull_request the PR's own copy of these
          # workflows runs, so a PR could weaken the checks that review it.
          SENSITIVE=$(git diff origin/main..HEAD --name-only | grep -E '^(\.github/|LICENSE|NOTICE\.md|SECURITY\.md|install\.(sh|ps1)$|bin/install\.js$|package\.json$)' || true)
          if [ -n "$SENSITIVE" ]; then
            mark_warn "touches sensitive files, review line by line: $(echo "$SENSITIVE" | tr "\n" " ")"
          fi

          # 10b. Binary files. Fine for images, but nothing should ship a blob.
          BINARIES=$(git diff origin/main..HEAD --numstat | awk '$1=="-" && $2=="-" {print $3}' || true)
          if [ -n "$BINARIES" ]; then
            mark_warn "binary file(s) added or changed: $(echo "$BINARIES" | tr "\n" " ")"
          fi

          # 9. Detection-language warning — scan code surfaces only.
          # receipt.md / SECURITY.md / NOTICE.md / README.md contain
          # prohibition statements by design ("Do not produce originality
          # scores"); we explicitly do NOT scan those.
          DETECTION_HITS=$(grep -rEn "originality.score|detection.score|AI.probability" bin/install.js install.sh install.ps1 src/schema.yaml 2>/dev/null || true)
          if [ -n "$DETECTION_HITS" ]; then
            mark_warn "Detection-related language in code surface (bin/install.js / install scripts / schema.yaml) — these surfaces must not reference detection concepts"
          else
            mark_pass "No detection-language in code surfaces"
          fi

          # (conventional commits moved up to FAIL section as rule 8d)

          # 11. INSTALL.md updated if an actual provider entry was added
          # or removed. Match only `id: '<word>'` lines being added or
          # removed in bin/install.js, not generic mentions of "providers".
          PROVIDER_DIFF=$(git diff origin/main..HEAD -- bin/install.js | grep -E "^[+-]\s*id: ['\"][a-z]+['\"]" || true)
          if [ -n "$PROVIDER_DIFF" ]; then
            if ! git diff origin/main..HEAD -- INSTALL.md | grep -q "^+"; then
              mark_warn "an entry was added or removed from the providers array but INSTALL.md not updated — verify the agent matrix is current"
            else
              mark_pass "INSTALL.md updated alongside provider entry changes"
            fi
          fi

          # 12. CHANGELOG.md is written by Release Please from commit subjects.
          #     A hand edit lands below the next release section and misses the notes.
          if git diff --name-only origin/main..HEAD | grep -qx "CHANGELOG.md" \
             && [[ "${GITHUB_HEAD_REF:-}" != release-please--* ]]; then
            mark_warn "CHANGELOG.md is generated by Release Please, put the change in the commit subject instead"
          fi

          # =============================================================
          # Build sticky comment — only show what NEEDS attention.
          # Do not expose the full checklist of what passed — contributors
          # don't need our complete review surface.
          # =============================================================
          {
            echo "## PromptCite PR Checks"
            echo ""
            if [ ${#FAIL[@]} -eq 0 ] && [ ${#WARN[@]} -eq 0 ]; then
              echo "✅ **Looks good.** No blockers, no warnings — ready for maintainer review."
            else
              if [ ${#FAIL[@]} -gt 0 ]; then
                echo "### ❌ Blockers — must fix before merge"
                echo ""
                for item in "${FAIL[@]}"; do echo "- $item"; done
                echo ""
              fi
              if [ ${#WARN[@]} -gt 0 ]; then
                echo "### ⚠️ Warnings — please review"
                echo ""
                for item in "${WARN[@]}"; do echo "- $item"; done
                echo ""
              fi
              if [ ${#FAIL[@]} -gt 0 ]; then
                echo "_This PR is blocked from merge until the blockers above are resolved._"
              fi
            fi
            echo ""
            echo "---"
            echo "_Automated PR-checks bot._"
          } > /tmp/pr-checks-comment.md

          # Save comment for next step
          echo 'comment<<EOF' >> $GITHUB_OUTPUT
          cat /tmp/pr-checks-comment.md >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
          # Fork PRs get a read-only token, so the comment step can't post.
          # The run summary works for everyone.
          cat /tmp/pr-checks-comment.md >> "$GITHUB_STEP_SUMMARY"

          # Exit non-zero if any blockers
          if [ ${#FAIL[@]} -gt 0 ]; then
            echo ""
            echo "::error::PR checklist found ${#FAIL[@]} blocker(s)"
            exit 1
          fi

      - name: Post sticky PR comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v2
        with:
          header: pr-checks
          message: ${{ steps.checks.outputs.comment }}
